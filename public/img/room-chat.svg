<!--
  MN-04 · Icono del botón de chat que se inyecta en la barra de Daily
  (`customTrayButtons`, ver `live-room.tsx`).

  Tres cosas que NO son estética y por las que este fichero existe:

  1. Lo carga el IFRAME de Daily, que vive en otro origen, así que la ruta se
     le pasa SIEMPRE como URL absoluta (`window.location.origin + …`). Una ruta
     relativa se resolvería contra `daily.co` y el botón saldría sin icono.
  2. Daily lo pinta como imagen, no lo inserta en el DOM: `currentColor` no
     heredaría nada. Por eso el trazo es blanco a mano — la barra de la sala es
     oscura en los dos modos porque el `theme` que le pasamos fija `background`.
  3. 36×36 es el tamaño que espera la barra de Prebuilt.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <path
    d="M10 10h16a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-8.7l-5.3 4v-4H10a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3Z"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
</svg>
