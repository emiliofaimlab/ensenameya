name: Supabase migrations

# Aplica las migraciones de supabase/migrations/ al proyecto del ambiente
# correspondiente. Requiere (ver docs/ENTORNOS.md §2C):
#   - secret de repo: SUPABASE_ACCESS_TOKEN
#   - GitHub Environments "staging" y "production", cada uno con secrets:
#       SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
# ponytail: dev no entra en CI — se aplica a mano (npm run db:push) o local (db:reset).

on:
  push:
    branches: [staging, main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"

jobs:
  db-push:
    runs-on: ubuntu-latest
    # main → production; staging → staging. Cada Environment trae sus propios secrets.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
