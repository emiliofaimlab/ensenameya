name: Supabase migrations

# Aplica supabase/migrations/ al proyecto del ambiente correspondiente vía
# conexión directa (--db-url), sin access token ni Docker.
# Requiere (ver docs/ENTORNOS.md §2C): GitHub Environments "production" y
# "development", cada uno con el secret SUPABASE_DB_URL (session pooler,
# connection string percent-encoded).

on:
  push:
    branches: [main, dev]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"

jobs:
  db-push:
    runs-on: ubuntu-latest
    # main → production; dev → development. Cada Environment trae su SUPABASE_DB_URL.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      # Versión FIJA, no `latest`: resolver "latest" consulta la API de GitHub
      # sin autenticar y un día cualquiera devuelve "rate limit exceeded" — nos
      # tumbó el job del 27-jul (run 30305230981) sin que hubiera nada roto en
      # el repo. Fijarla lo hace además reproducible: el CI aplica migraciones
      # con la misma CLI con la que se probaron en local.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          # Autenticar la descarga sube muchísimo el límite de peticiones.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push migrations
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL no configurado para este entorno — saltando."
            echo "Cárgalo como Environment secret (ver docs/ENTORNOS.md §3D)."
            exit 0
          fi
          # ⚠️ `--include-all` NO es una relajación cosmética, y sin él este job
          # falla en cuanto dos ramas se entrelazan. Pasó el 3-sep-2026: `dev`
          # tenía aplicada `20260902100000` (grabación) y le llegó después
          # `20260901210000` (termómetro), con timestamp ANTERIOR porque venía de
          # otra rama. El CLI se niega —«Found local migration files to be
          # inserted before the last migration on remote database»— y no aplica
          # NADA, ni siquiera las que sí van en orden. Producción está hoy en esa
          # misma situación.
          #
          # Lo que se acepta a cambio: una migración puede correr después de otra
          # con timestamp mayor. Es real, y el repo ya convive con ello —las
          # migraciones aquí son inmutables y se corrigen con una nueva (regla de
          # oro 5), así que ninguna depende de ser la última.
          # ponytail: el techo es ese. La alternativa seria es renumerar al
          # rebasar, que exige disciplina en cada rama y falla en silencio cuando
          # alguien la olvida — y ahí el fallo es un despliegue a medias.
          supabase db push --yes --include-all --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
