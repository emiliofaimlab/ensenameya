name: Supabase migrations

# Aplica supabase/migrations/ al proyecto del ambiente correspondiente vía
# conexión directa (--db-url), sin access token ni Docker.
# Requiere (ver docs/ENTORNOS.md §2C): GitHub Environments "production" y
# "development", cada uno con el secret SUPABASE_DB_URL (session pooler,
# connection string percent-encoded).

on:
  push:
    branches: [main, dev]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"

jobs:
  db-push:
    runs-on: ubuntu-latest
    # main → production; dev → development. Cada Environment trae su SUPABASE_DB_URL.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      # Versión FIJA, no `latest`: resolver "latest" consulta la API de GitHub
      # sin autenticar y un día cualquiera devuelve "rate limit exceeded" — nos
      # tumbó el job del 27-jul (run 30305230981) sin que hubiera nada roto en
      # el repo. Fijarla lo hace además reproducible: el CI aplica migraciones
      # con la misma CLI con la que se probaron en local.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          # Autenticar la descarga sube muchísimo el límite de peticiones.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push migrations
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL no configurado para este entorno — saltando."
            echo "Cárgalo como Environment secret (ver docs/ENTORNOS.md §3D)."
            exit 0
          fi
          supabase db push --yes --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
