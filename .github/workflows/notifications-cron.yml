# Vacía la cola de notificaciones por correo (US-1201).
#
# No va en Vercel Cron como la purga de grabaciones porque el plan Hobby limita
# los crons a UNA VEZ AL DÍA, y un aviso de "tienes 24 h para aceptar esta
# reserva" que llega mañana no sirve de nada. Actions da 5 minutos, logs y
# reejecución manual.
#
# Dos limitaciones conocidas de los programados de GitHub, dichas aquí para que
# nadie las descubra depurando:
#   · se retrasan cuando la cola de Actions va cargada — 10-15 min es normal.
#     Aceptable para un correo; NO lo sería para un cobro.
#   · GitHub desactiva los workflows programados tras 60 días sin actividad en
#     el repo. Si los correos dejan de salir sin más, mirar eso primero.
#
# Si algún día el proyecto pasa a Vercel Pro, esto se mueve a `vercel.json` y
# el workflow se borra.
name: Notificaciones por correo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # para poder forzar una pasada sin esperar

# Si una pasada se alarga, la siguiente no se le encima: la cola sigue ahí.
concurrency:
  group: notifications-cron
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Vaciar la cola
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Falta la variable APP_BASE_URL o el secret CRON_SECRET del repo."
            echo "Sin eso no se puede llamar al endpoint. Ver docs/ENTORNOS.md."
            exit 1
          fi

          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/notifications-send")

          echo "HTTP $code"
          cat /tmp/out.json; echo

          # Un 503 es "no hay CRON_SECRET en Vercel" y un 401 es "no coincide":
          # las dos son configuración a medias, y deben verse en rojo.
          [ "$code" = "200" ]

      # La misma pasada, contra la PREVIEW de la rama `dev`, para poder probar
      # los correos sin desplegar a producción. Va en un paso aparte y no en la
      # matriz porque las dos mitades no valen lo mismo: si prod no envía es un
      # incidente, si dev no envía es una molestia.
      #
      # ⚠️ ESTE PASO LLEVABA `continue-on-error: true`, y ya no. Eso hacía que el
      # workflow saliera VERDE con la cola de dev sin vaciar: el fallo mudo de la
      # regla de oro 11 —ni build en rojo ni 500, solo un `::warning::` que nadie
      # lee— y el motivo de que se creyera durante semanas que «los correos de
      # dev tardan», cuando lo que pasaba era que no salían. Ahora falla de
      # verdad y además lo escribe en el resumen del job, que es lo que se ve sin
      # abrir los logs.
      #
      # Que ponga el job en rojo NO retrasa ni cancela producción: es el ÚLTIMO
      # paso y el de prod ya corrió y ya envió. El aspa es solo el aviso.
      #
      # ⚠️ La preview está detrás del SSO de Vercel y responde 302 antes de
      # tocar nuestro código (docs/ENTORNOS.md §5): sin `VERCEL_PROTECTION_BYPASS`
      # esto no llega a ninguna parte, y un cron que no llega se parece
      # muchísimo a un cron que no tenía trabajo. Por eso el 30x se dice con
      # todas las letras en vez de pasar en silencio.
      #
      # ⚠️ Y la cola de dev se ensucia sola: el seed usa direcciones
      # `@ensenameya.dev`, un dominio SIN MX, así que cada tanda de pruebas
      # encola avisos que solo pueden rebotar. Comparte cuenta y dominio de
      # Resend con producción, o sea que los rebotes de dev los paga la
      # reputación de prod. Antes de sembrar: `docs/QA-LANZAMIENTO.md` §4.6.
      - name: Vaciar la cola de dev (preview · el último del job)
        env:
          DEV_URL: ${{ vars.DEV_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -uo pipefail

          if [ -z "${DEV_URL:-}" ]; then
            echo "Sin la variable DEV_BASE_URL no hay nada que hacer aquí. Saltando."
            exit 0
          fi

          if [ -n "${BYPASS:-}" ]; then
            set -- -H "x-vercel-protection-bypass: $BYPASS"
          else
            set --
          fi

          code=$(curl -sS --max-time 120 -o /tmp/dev.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$@" \
            "$DEV_URL/api/cron/notifications-send")

          echo "HTTP $code"
          cat /tmp/dev.json; echo

          case "$code" in
            200) exit 0 ;;
            30*) motivo="$code — Deployment Protection. Falta o caducó el secret VERCEL_PROTECTION_BYPASS." ;;
            503) motivo="503 — falta CRON_SECRET en el scope Preview de Vercel." ;;
            401) motivo="401 — el CRON_SECRET de Preview no coincide con el de GitHub." ;;
            *)   motivo="$code — la pasada de dev no salió bien." ;;
          esac

          # Las dos salidas, porque se miran en sitios distintos: `::error::` sale
          # anotado en la corrida y el resumen es lo que se lee en la lista de
          # Actions sin entrar. Y `exit 1` para que haya aspa que mirar.
          echo "::error::La cola de dev no se vació: $motivo"
          echo "⚠️ La cola de correo de **dev** no se vació: $motivo" >> "$GITHUB_STEP_SUMMARY"
          echo "Producción sí se vació: eso lo hizo el paso anterior, que va primero a propósito." >> "$GITHUB_STEP_SUMMARY"
          exit 1
